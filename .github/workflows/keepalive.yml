# Backup keep-alive for the Supabase Free plan (pauses after a week without database activity).
# The main ping is the daily Vercel cron in vercel.json; this one runs twice a day from GitHub.
# Optional repo secret CRON_SECRET must match the Vercel env var of the same name.
# GitHub turns off scheduled workflows in public repos after 60 days without commits; re-enable it
# from the Actions tab if that happens.
name: Keep Supabase awake

on:
  schedule:
    - cron: "41 5,17 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/keepalive
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          auth=()
          if [ -n "$CRON_SECRET" ]; then auth=(-H "Authorization: Bearer $CRON_SECRET"); fi
          code=$(curl -sS --retry 3 --retry-delay 20 -o body.json -w "%{http_code}" "${auth[@]}" https://pujoguide.vercel.app/api/keepalive)
          echo "HTTP $code"; cat body.json; echo
          test "$code" = 200
